name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Audit project axioms
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Test the axiom audit
        run: python3 scripts/test_axiom_audit.py
      - name: Existing computational regression checks
        run: cd .. && node scripts/verify.cjs
      - name: Record verification and unchanged dependency pins
        run: |
          git diff --exit-code -- lean-toolchain lakefile.toml lakefile.lean lake-manifest.json
          {
            echo '## Lean verification passed'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Toolchain: $(cat lean-toolchain)"
            echo 'Passed: library build, project axiom audit, audit rejection controls.'
          } >> "$GITHUB_STEP_SUMMARY"

  catalogue:
    name: Full Aristotle catalogue (28 theorems)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: .
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Check catalogue coverage
        run: python3 scripts/verify_catalogue.py
      - name: Audit every catalogue declaration
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Test catalogue audit rejection controls
        run: python3 scripts/test_axiom_audit.py
      - name: Record catalogue verification and unchanged dependency pins
        run: |
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          {
            echo '## Complete Aristotle catalogue verified'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Toolchain: $(cat lean-toolchain)"
            echo 'Passed: full RequestProject build, 28-name catalogue correspondence, all project-declaration axiom audit, four rejection controls.'
          } >> "$GITHUB_STEP_SUMMARY"
